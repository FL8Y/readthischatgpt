name: study-app

on:
  push:
    paths:
      - 'FLY8 Study/**'
      - '.github/workflows/study-app.yml'
  pull_request:
    paths:
      - 'FLY8 Study/**'
      - '.github/workflows/study-app.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FLY8 Study
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FLY8 Study/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform android
        env:
          CI: '1'
